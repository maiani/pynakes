[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pynakes"
version = "0.1.0"
description = "Agent-friendly, round-trip-faithful BibTeX/BibLaTeX maintenance toolkit"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "Andrea Maiani", email = "andrea.maiani@su.se"}
]
keywords = [
    "bibtex",
    "biblatex",
    "bibliography",
    "citations",
    "references",
    "jabref",
    "latex",
    "doi",
    "reference-management",
    "cli",
    "agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.6.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.100.0",
    "ruff>=0.1.0",
    "build>=1.2.0",
    "twine>=5.0.0",
]
docs = [
    # Docs site generator. Pinned loosely; pre-1.0, so expect churn.
    "zensical>=0.0.45",
]

# NOTE: update these URLs to the real repository slug before publishing.
[project.urls]
Homepage = "https://github.com/andreamaiani/pynakes"
Repository = "https://github.com/andreamaiani/pynakes"
Issues = "https://github.com/andreamaiani/pynakes/issues"
Changelog = "https://github.com/andreamaiani/pynakes/blob/main/CHANGELOG.md"

[project.scripts]
pynakes = "pynakes.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pynakes = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src/pynakes"]
