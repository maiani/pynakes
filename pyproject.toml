[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pynakes"
version = "0.1.0"
description = "Agent-friendly BibTeX library management tool"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Andrea Maiani", email = "andrea.maiani@su.se"}
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.6.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.100.0",
    "ruff>=0.1.0",
]
docs = [
    # Docs site generator. Pinned loosely; pre-1.0, so expect churn.
    "zensical>=0.0.45",
]

[project.scripts]
pynakes = "pynakes.cli:app"

[tool.setuptools]
packages = ["pynakes"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src/pynakes"]
