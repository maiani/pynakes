[build-system]
requires = ["setuptools>=77.0", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pynakes"
dynamic = ["version"]
description = "Reference management engine for BibTeX, BibLaTeX, and their materials"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    {name = "Andrea Maiani", email = "dev@andreamaiani.com"}
]
keywords = [
    "bibtex",
    "biblatex",
    "bibliography",
    "citations",
    "references",
    "jabref",
    "latex",
    "doi",
    "reference-management",
    "cli",
    "agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1.0",
    "httpx>=0.27.0",
    "typer>=0.26.0",
    "rich>=13.8.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.6.0",
    "pytest>=9.0.0",
    "pytest-cov>=4.1.0",
    "coverage>=7.10",
    "hypothesis>=6.100.0",
    "ty==0.0.86",
    "pyyaml>=6.0",
    "ruff>=0.16,<0.17",
    "build>=1.2.0",
    "twine>=5.0.0",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[project.urls]
Homepage = "https://github.com/maiani/pynakes"
Repository = "https://github.com/maiani/pynakes"
Issues = "https://github.com/maiani/pynakes/issues"
Changelog = "https://github.com/maiani/pynakes/blob/main/CHANGELOG.md"

[project.scripts]
pynakes = "pynakes.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

# The version comes from git. A checkout at tag vX.Y.Z is exactly X.Y.Z; past
# it, the version names the next minor release plus the distance and commit
# (0.7.0.dev36+gd42f2cf), so a development install never claims to be a release
# it is not. A release-* branch bumps the patch number instead. A checkout must
# have its history and tags: a shallow clone yields 0.1.devN.
[tool.setuptools_scm]
version_scheme = "release-branch-semver"

[tool.setuptools.package-data]
pynakes = [
    "py.typed",
    "providers/pdf_overrides.json",
    "journal_abbreviations/*.csv",
    "journal_abbreviations/NOTICE.md",
]

[tool.pytest]
testpaths = ["tests"]
addopts = ["-v", "--tb=short"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "PLW1514"]
ignore = ["E501"]
# PLW1514 (text I/O without an explicit encoding) is a preview rule. A bare
# open()/read_text() uses the locale's code page on Windows, not UTF-8.
preview = true
explicit-preview-rules = true

[tool.coverage.run]
source = ["src/pynakes"]
# sys.monitoring (Python 3.12+) measures the same lines at a fraction of the
# tracing core's cost: the suite with coverage runs in about half the time.
core = "sysmon"

[tool.ty.environment]
python-version = "3.12"
python-platform = "all"

[tool.ty.src]
include = ["src/pynakes"]

# Type-checking baseline: suppress only recorded rule families in each
# module. Shrink this list; never broaden it.


[[tool.ty.overrides]]
include = ["src/pynakes/_integrity_published.py"]
[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
not-iterable = "ignore"

[[tool.ty.overrides]]
include = ["src/pynakes/bibtex_writer.py"]
[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
unresolved-attribute = "ignore"

[[tool.ty.overrides]]
include = ["src/pynakes/canonical.py"]
