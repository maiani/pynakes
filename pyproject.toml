[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pynakes"
version = "0.6.0"
description = "Agent-friendly, round-trip-faithful BibTeX/BibLaTeX maintenance toolkit"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "Andrea Maiani", email = "dev@andreamaiani.com"}
]
keywords = [
    "bibtex",
    "biblatex",
    "bibliography",
    "citations",
    "references",
    "jabref",
    "latex",
    "doi",
    "reference-management",
    "cli",
    "agent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.6.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.100.0",
    "ruff>=0.1.0",
    "build>=1.2.0",
    "twine>=5.0.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[project.urls]
Homepage = "https://github.com/maiani/pynakes"
Repository = "https://github.com/maiani/pynakes"
Issues = "https://github.com/maiani/pynakes/issues"
Changelog = "https://github.com/maiani/pynakes/blob/main/CHANGELOG.md"

[project.scripts]
pynakes = "pynakes.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pynakes = ["py.typed", "providers/pdf_overrides.json"]

[tool.pytest]
testpaths = ["tests"]
addopts = ["-v", "--tb=short"]
markers = [
    "agent_eval: opt-in real-agent beta-test harness",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src/pynakes"]
