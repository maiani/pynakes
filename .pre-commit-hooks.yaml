# pynakes pre-commit hooks.
#
# Add to a repository's .pre-commit-config.yaml:
#
#   repos:
#     - repo: https://github.com/maiani/pynakes
#       rev: vX.Y.Z  # a released tag
#       hooks:
#         - id: pynakes-lint
#         - id: pynakes-keys-check
#         - id: pynakes-files-check   # opt-in: validates linked-file paths
#         - id: pynakes-dedupe-check  # opt-in: flags duplicate works
#
# Every hook is read-only, offline, and deterministic. pre-commit passes the
# staged .bib files as arguments; --strict makes a finding fail the commit.
# pynakes-lint gates on warnings and errors; info findings are not reported
# (add `args: [--severity, info]` to gate on them too).

- id: pynakes-lint
  name: pynakes lint
  description: Validate BibTeX entries and fail on any warning or error not suppressed by lint-ignore, --ignore, or an ignore directive; info findings do not fail the commit.
  entry: pynakes lint --strict --severity warning
  language: python
  files: \.bib$
  types: [file]

- id: pynakes-keys-check
  name: pynakes lint --only duplicate_key
  description: Fail if any citation key is duplicated (unless lint-ignore suppresses it).
  entry: pynakes lint --only duplicate_key --strict
  language: python
  files: \.bib$
  types: [file]

- id: pynakes-files-check
  name: pynakes asset check
  description: Fail if any linked file is missing or the wrong type.
  entry: pynakes asset check --strict
  language: python
  files: \.bib$
  types: [file]
  stages: [manual]

- id: pynakes-dedupe-check
  name: pynakes dedupe check
  description: Fail if duplicate works (same DOI/arXiv/title) are present.
  entry: pynakes dedupe check --strict
  language: python
  files: \.bib$
  types: [file]
  stages: [manual]
