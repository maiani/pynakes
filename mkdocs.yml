site_name: pynakes
site_description: Agent-friendly BibTeX library management tool
site_author: Andrea Maiani
site_url: https://pynakes.example.com
repo_url: https://github.com/maiani/pynakes
copyright: Copyright &copy; 2026 The authors

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - content.code.copy
    - navigation.footer
    - navigation.sections
    - navigation.top
    - toc.follow
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Quick Start: guides/quickstart.md
  - Installation: guides/installation.md
  - Usage: guides/usage.md
  - Import Providers: guides/import-providers.md
  - Library Profile: guides/library-profile.md
  - Public API & Stability: guides/api-stability.md
  - LLM Integration: guides/llm-integration.md
  - Agent Beta Eval: guides/agent-beta-eval.md
  - Git Workflows: guides/git-workflows.md
  - Philosophy: vision.md
  - Architecture: guides/architecture.md
  - JabRef Compatibility: guides/jabref-compatibility.md
  - Pinax (corpus layer): guides/pinax.md
  - API Reference:
      - Overview: api/index.md
      - Module Reference: api/reference.md
  - Examples: examples/index.md
  - FAQ: guides/faq.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_if_no_docstring: true
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            docstring_section_style: table
            merge_init_into_class: true
            filters: ["!^_"]

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
