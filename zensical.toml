[project]
site_name = "pynakes"
site_description = "Reference management engine for BibTeX, BibLaTeX, and their materials"
site_author = "Andrea Maiani"
repo_url = "https://github.com/maiani/pynakes"
copyright = "Copyright &copy; 2026 The authors"
docs_dir = "docs"
site_dir = "site"
nav = [
  { "Home" = "index.md" },
  { "Quick Start" = "guides/quickstart.md" },
  { "Installation" = "guides/installation.md" },
  { "Usage" = "guides/usage.md" },
  { "Command Reference" = "guides/command-reference.md" },
  { "Network and Privacy" = "guides/network-and-privacy.md" },
  { "Import Providers" = "guides/import-providers.md" },
  { "Metadata Reference" = "guides/metadata-reference.md" },
  { "Public API" = "guides/public-api.md" },
  { "LLM Integration" = "guides/llm-integration.md" },
  { "Git Workflows" = "guides/git-workflows.md" },
  { "Philosophy" = "vision.md" },
  { "Architecture" = "guides/architecture.md" },
  { "Type Checking" = "guides/type-checking.md" },
  { "JabRef Compatibility" = "guides/jabref-compatibility.md" },
  { "Pinax" = "guides/pinax.md" },
  { "API Reference" = [
    { "Overview" = "api/index.md" },
    { "Module Reference" = "api/reference.md" },
  ] },
  { "Examples" = "examples/index.md" },
  { "FAQ" = "guides/faq.md" },
]

[project.theme]
language = "en"
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.sections",
  "navigation.top",
  "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
show_root_heading = true
show_root_full_path = false
show_source = false
show_if_no_docstring = true
show_signature_annotations = true
separate_signature = true
members_order = "source"
docstring_section_style = "table"
merge_init_into_class = true
filters = ["!^_"]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.tables]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]

[project.markdown_extensions."pymdownx.highlight"]
anchor_linenums = true

[project.markdown_extensions."pymdownx.inlinehilite"]
[project.markdown_extensions."pymdownx.superfences"]
[project.markdown_extensions."pymdownx.snippets"]
