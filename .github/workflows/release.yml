name: Release

# A pushed v* tag releases: checks, build, tests against the built wheel, then
# PyPI, then the GitHub release. Run it by hand for a dry run: every check and
# test, nothing published (or TestPyPI, when asked and configured).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      testpypi:
        description: "Also publish to TestPyPI (needs the testpypi environment)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Release checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history and main, to tell whether the tag is on main.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Tag matches pyproject's version, tag is on main, CHANGELOG has a
      # section for the version. A dry run checks only the CHANGELOG.
      - name: Check the release is ready
        id: check
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            python .github/scripts/check_release.py --tag "$GITHUB_REF_NAME"
          else
            python .github/scripts/check_release.py
          fi

  build:
    name: Build distributions
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # The suite against what will be published, not against the source tree:
  # catches a module or data file the wheel leaves out.
  test-wheel:
    name: Wheel / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install the wheel and test tools
        run: python -m pip install dist/*.whl pytest hypothesis pyyaml

      # pytest puts src/ on sys.path; without it, only the wheel can be imported.
      - name: Remove the source tree
        run: rm -rf src

      - name: Check the wheel is what gets imported
        run: |
          python -c "import pynakes, sys; print(pynakes.__file__); sys.exit('site-packages' not in pynakes.__file__)"

      - name: Run tests against the wheel
        run: pytest

  publish-pypi:
    name: Publish to PyPI
    needs: [verify, test-wheel]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [verify, test-wheel]
    if: github.event_name == 'workflow_dispatch' && inputs.testpypi
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # Only once PyPI has the release: a GitHub release must never announce a
  # version that cannot be installed.
  github-release:
    name: Create GitHub release
    needs: [verify, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
