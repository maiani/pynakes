name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Run tests
        run: pytest

  texlive-conformance:
    name: TeX Live 2025 conformance
    runs-on: ubuntu-latest
    container: ghcr.io/xu-cheng/texlive-full:2025

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify pinned toolchain
        shell: bash
        run: |
          test "$(bibtex --version | awk 'NR == 1 { print $2 }')" = "0.99d"
          test "$(biber --version | awk 'NR == 1 { print $3 }')" = "2.20"
          grep -F '\\def\abx@version{3.20}' "$(kpsewhich biblatex.sty)"

      - name: Validate BibTeX 0.99d corpus
        shell: bash
        run: |
          mkdir -p /tmp/pynakes-bibtex
          cp tests/fixtures/conformance/upstream/bibtex-0.99d-xampl.bib /tmp/pynakes-bibtex/refs.bib
          cp tests/fixtures/conformance/bibtex-0.99d-core.bib /tmp/pynakes-bibtex/core.bib
          printf '%s\n' '\\relax' '\\citation{*}' '\\bibstyle{plain}' '\\bibdata{refs}' > /tmp/pynakes-bibtex/refs.aux
          printf '%s\n' '\\relax' '\\citation{*}' '\\bibstyle{plain}' '\\bibdata{core}' > /tmp/pynakes-bibtex/core.aux
          cd /tmp/pynakes-bibtex
          bibtex refs
          bibtex core

      - name: Validate BibLaTeX 3.20 corpus with Biber
        shell: bash
        run: |
          mkdir -p /tmp/pynakes-biber
          cp tests/fixtures/conformance/upstream/biblatex-3.20-examples.bib /tmp/pynakes-biber/refs.bib
          cd /tmp/pynakes-biber
          biber --tool --validate-datamodel refs.bib
