name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The package version comes from git tags (setuptools-scm).
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      # Keep the engine fully checked without per-module rule overrides.
      - name: Ty
        run: ty check

  # Every operating system and Python version the package metadata claims.
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The package version comes from git tags (setuptools-scm).
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest --cov --cov-fail-under=90

  # The oldest direct dependencies the package declares, on the oldest Python:
  # what a user with an older environment actually gets.
  lowest:
    name: Lowest dependencies / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The package version comes from git tags (setuptools-scm).
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # From PyPI: setup-uv publishes no major-version tag to reference.
      - name: Install uv
        run: python -m pip install uv

      # The pdf extra has a floor too, and the PDF tests need it.
      - name: Install package at its dependency floors
        run: uv pip install --system --resolution lowest-direct -e ".[pdf]"

      # Test tools at their current versions: the floors under test are the
      # runtime ones, not pytest's.
      - name: Install test tools
        run: uv pip install --system pytest hypothesis pyyaml

      - name: Check the floors are what is installed
        run: python .github/scripts/check_dependency_floors.py

      - name: Run tests
        run: pytest

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The package version comes from git tags (setuptools-scm).
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev,docs]"

      - name: Test offline documentation examples and generated reference
        run: pytest tests/test_doc_examples.py

      - name: Build docs
        run: zensical build --strict

  vscode:
    name: Editor extension
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The package version comes from git tags (setuptools-scm).
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/vscode/package-lock.json

      # The floor from pyproject's requires-python, so the bundle is proven
      # against the oldest interpreter the engine claims to support rather than
      # only against whatever is newest on the runner.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Node dependencies
        working-directory: clients/vscode
        run: npm ci

      - name: Compile
        working-directory: clients/vscode
        run: npm run compile

      # The contract and webview tests run this repository's engine; without its
      # dependencies they skip, and a green job would hide that none of them ran.
      - name: Install the engine's dependencies
        run: python -m pip install -e .

      - name: Run tests
        working-directory: clients/vscode
        env:
          PYNAKES_REQUIRE_ENGINE: "1"
        run: npm test

      - name: Vendor the engine
        working-directory: clients/vscode
        run: node scripts/vendor-engine.mjs

      # The vendored tree is generated and must never be committed; a missing
      # ignore rule would otherwise add ~1200 files to the repository unnoticed.
      - name: Check the vendored engine stays out of git
        run: git check-ignore --quiet clients/vscode/engine

      # End-to-end through the bundle: the path a user with no pynakes install
      # takes, exercising the generated launcher rather than the developer's own
      # installed engine.
      - name: Smoke-test the bundled engine
        run: |
          python -P clients/vscode/engine/pynakes_launcher.py --version
          python -P clients/vscode/engine/pynakes_launcher.py \
            inspect tests/fixtures/biblatex_sample.bib --json > /dev/null

      - name: Check native wheel selection
        env:
          PYTHONPATH: clients/vscode/engine
        run: python -m unittest discover -s clients/vscode/scripts -p 'test_bundle_*.py'

      - name: Save bundled engine for platform checks
        uses: actions/upload-artifact@v7
        with:
          name: vscode-engine
          path: clients/vscode/engine/

  vscode-runtime:
    name: Bundled engine (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: vscode
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-latest]
        python: ["3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: vscode-engine
          path: clients/vscode/engine/
      - name: Run isolated bundle without installed engine dependencies
        run: |
          python -I -S clients/vscode/engine/pynakes_launcher.py --version
          python -I -S clients/vscode/engine/pynakes_launcher.py inspect tests/fixtures/biblatex_sample.bib --json

  package:
    name: Distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The package version comes from git tags (setuptools-scm).
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - name: Smoke-test built wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          pynakes --version
          pynakes capabilities --json

  desktop:
    name: Standalone editor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: clients/desktop/package-lock.json
      - run: python -m pip install -e .
      - run: npm ci
        working-directory: clients/desktop
      - run: npm test
        working-directory: clients/desktop
      # Ubuntu 24.04 restricts unprivileged user namespaces, so Electron falls back
      # to its SUID sandbox helper, which npm cannot install setuid, and aborts.
      # Allowing the namespaces keeps the smoke test sandboxed.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: xvfb-run -a npm run smoke
        working-directory: clients/desktop
