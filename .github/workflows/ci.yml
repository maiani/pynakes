name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      # Modules listed in pyproject's mypy baseline are skipped; every other
      # module must type-check clean.
      - name: Mypy
        run: mypy

  # Every operating system and Python version the package metadata claims.
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
        experimental: [false]
        include:
          # The next Python, as an early warning; allowed to fail.
          - os: ubuntu-latest
            python-version: "3.15"
            experimental: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest --cov --cov-fail-under=90

  # The oldest direct dependencies the package declares, on the oldest Python:
  # what a user with an older environment actually gets.
  lowest:
    name: Lowest dependencies / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # From PyPI: setup-uv publishes no major-version tag to reference.
      - name: Install uv
        run: python -m pip install uv

      - name: Install package at its dependency floors
        run: uv pip install --system --resolution lowest-direct -e .

      # Test tools at their current versions: the floors under test are the
      # runtime ones, not pytest's.
      - name: Install test tools
        run: uv pip install --system pytest hypothesis pyyaml

      - name: Check the floors are what is installed
        run: python .github/scripts/check_dependency_floors.py

      - name: Run tests
        run: pytest

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[docs]"

      - name: Build docs
        run: mkdocs build --strict

  editor:
    name: Editor extension
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editor/package-lock.json

      # The floor from pyproject's requires-python, so the bundle is proven
      # against the oldest interpreter the engine claims to support rather than
      # only against whatever is newest on the runner.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Node dependencies
        working-directory: editor
        run: npm ci

      - name: Compile
        working-directory: editor
        run: npm run compile

      - name: Run tests
        working-directory: editor
        run: npm test

      - name: Vendor the engine
        working-directory: editor
        run: node scripts/vendor-engine.mjs

      # The vendored tree is generated and must never be committed; a missing
      # ignore rule would otherwise add ~1200 files to the repository unnoticed.
      - name: Check the vendored engine stays out of git
        run: git check-ignore --quiet editor/engine

      # End-to-end through the bundle: the path a user with no pynakes install
      # takes, exercising the generated launcher rather than the developer's own
      # installed engine.
      - name: Smoke-test the bundled engine
        run: |
          python -P editor/engine/pynakes_launcher.py --version
          python -P editor/engine/pynakes_launcher.py \
            inspect tests/fixtures/biblatex_sample.bib --json > /dev/null

  package:
    name: Distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build tools
        run: python -m pip install build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - name: Smoke-test built wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          pynakes --version
          pynakes capabilities --json
